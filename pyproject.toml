[project]
name = "kaggle-ws"
version = "0.1.0"
description = "Kaggle workspace: write locally, run on Colab"
readme = "README.md"
# match the Colab runtime (Python 3.12)
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.7",
    "numpy",
    "pandas",
    "scikit-learn",
    "lightgbm",
    "matplotlib",
    "tqdm",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_ws"]

[tool.ruff]
line-length = 100
